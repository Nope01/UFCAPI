services:
  api:
    build: .
    container_name: ufcapi
    ports:
      - "8080:8080"
    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: ufc
      DB_USER: postgres
      DB_PASSWORD: nope42069

